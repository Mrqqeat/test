<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepSeek Pro Writer | 纯粹写作</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#0B0F19">
	
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: { 900: '#0B0F19', 800: '#111827', 700: '#1F2937', border: '#ffffff1a' },
                        primary: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5' }
                    },
                    animation: { 'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite' },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 0 0 rgba(99, 102, 241, 0)' },
                            '50%': { boxShadow: '0 0 20px 2px rgba(99, 102, 241, 0.3)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4B5563; }
        .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .toast-enter { transform: translateY(-20px); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .toast-leave { opacity: 0; transition: opacity 0.2s ease-in; }
        #assistant_prefix { padding-bottom: 160px; }
        input[type="password"], input[type="text"], select, textarea { font-size: 16px !important; }
		:root { color-scheme: dark; }
        body { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        button:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
        #sidebar { overscroll-behavior: contain; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<!-- 使用 100dvh 解决手机浏览器地址栏遮挡问题 -->
<body class="bg-dark-900 text-gray-300 font-sans h-[100dvh] flex flex-col overflow-hidden selection:bg-primary-500/30 selection:text-white">

    <!-- 顶部导航栏 -->
    <header class="h-14 border-b border-dark-border flex items-center justify-between px-4 md:px-6 bg-dark-900/80 backdrop-blur-md z-20 shrink-0">
        <div class="flex items-center gap-3">
            <!-- 手机端菜单按钮 -->
            <button onclick="toggleMobileMenu()" class="md:hidden text-gray-400 hover:text-white transition p-1" title="打开设置">
                <i class="ph ph-list text-2xl"></i>
            </button>
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-400 to-primary-600 hidden md:flex items-center justify-center text-white shadow-lg shadow-primary-500/20">
                <i class="ph-bold ph-pen-nib text-xl"></i>
            </div>
            <h1 class="font-semibold text-gray-100 tracking-wide text-sm md:text-base flex items-center">
                DeepSeek Studio <span class="hidden md:inline-block text-[10px] md:text-xs font-normal text-primary-400 bg-primary-500/10 px-2 py-0.5 rounded ml-2">Web Pro</span>
            </h1>
        </div>
        <div class="flex items-center gap-2 md:gap-4 text-xs md:text-sm">
            <button onclick="toggleFocusMode()" class="hidden md:flex items-center gap-2 text-gray-400 hover:text-white transition" title="专注模式">
                <i class="ph ph-corners-out text-lg"></i>
            </button>
            <button onclick="exportDoc()" class="flex items-center gap-1 md:gap-2 text-gray-400 hover:text-white transition bg-dark-800 px-3 py-1.5 rounded-lg border border-dark-border">
                <i class="ph ph-export text-lg"></i> <span class="hidden sm:inline">导出TXT</span>
            </button>
        </div>
    </header>

    <!-- 主体工作区 -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- 手机端遮罩层 -->
        <div id="mobile-overlay" onclick="toggleMobileMenu()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-30 hidden transition-opacity duration-300 opacity-0"></div>

        <!-- 左侧：参数与设定 (响应式抽屉) -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-[85%] max-w-[320px] md:relative md:w-80 border-r border-dark-border bg-dark-900 md:bg-dark-800/30 flex flex-col transition-transform duration-300 transform -translate-x-full md:translate-x-0 shrink-0 shadow-2xl md:shadow-none">
            
            <!-- 手机端抽屉头部 -->
            <div class="md:hidden flex items-center justify-between px-5 py-4 border-b border-dark-border">
                <span class="font-bold text-gray-200 flex items-center gap-2"><i class="ph-fill ph-sliders text-primary-400 text-lg"></i> 引擎设置</span>
                <button onclick="toggleMobileMenu()" class="text-gray-400 hover:text-white p-1 bg-dark-800 rounded-md"><i class="ph ph-x text-lg"></i></button>
            </div>

            <div class="p-5 flex-1 overflow-y-auto space-y-6">
                <!-- 模块：全局设置 -->
                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 block">1. 核心鉴权 (API Key)</label>
                        <div class="relative">
                            <input type="password" id="api_key" class="w-full bg-dark-800 md:bg-dark-900 border border-dark-border rounded-lg p-2.5 pr-10 text-gray-200 focus:outline-none focus:border-primary-500 transition" placeholder="sk-...">
                            <button onclick="toggleKeyVisibility()" class="absolute right-3 top-2.5 text-gray-500 hover:text-gray-300">
                                <i id="key-icon" class="ph ph-eye text-lg"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 block">2. 模型选择 (Model)</label>
                        <select id="model_select" class="w-full bg-dark-800 md:bg-dark-900 border border-dark-border rounded-lg p-2.5 text-gray-200 focus:outline-none focus:border-primary-500 transition appearance-none cursor-pointer">
                            <option value="deepseek-v4-flash" selected>deepseek-v4-flash</option>
                            <option value="deepseek-v4-pro">deepseek-v4-pro</option>
                        </select>
                    </div>
                </div>

                <div class="h-px bg-dark-border w-full"></div>

                <!-- 模块：世界观设定 -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">3. 故事设定 (System Prompt)</label>
                    </div>
                    <textarea id="user_prompt" rows="5" class="w-full bg-dark-800 md:bg-dark-900 border border-dark-border rounded-xl p-3 text-gray-200 placeholder-gray-600 focus:outline-none focus:border-primary-500 transition resize-none" placeholder="在这里输入大纲或背景设定..."></textarea>
                </div>

                <!-- 模块：引擎参数 -->
                <div>
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4 block">4. 引擎参数 (Parameters)</label>
                    
                    <div class="space-y-3 mb-5">
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-gray-300">创作温度 <span class="text-gray-500 text-xs ml-1">(Temp)</span></span>
                            <span id="temp-val" class="font-mono text-primary-400 bg-primary-500/10 px-2 py-0.5 rounded text-xs">1.0</span>
                        </div>
                        <input type="range" id="temp" min="0" max="2.0" step="0.1" value="1.0" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-primary-500">
                    </div>

                    <div class="space-y-3">
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-gray-300">最大生成长度 <span class="text-gray-500 text-xs ml-1">(Tokens)</span></span>
                            <span id="tokens-val" class="font-mono text-primary-400 bg-primary-500/10 px-2 py-0.5 rounded text-xs">无限制</span>
                        </div>
                        <input type="range" id="max_tokens" min="256" max="8192" step="256" value="8192" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-primary-500">
                    </div>
                </div>
            </div>
            
            <div class="p-5 border-t border-dark-border bg-dark-900 md:bg-dark-800">
                <button onclick="clearAll()" class="w-full flex items-center justify-center gap-2 py-2 rounded-lg text-sm text-gray-400 hover:text-red-400 hover:bg-dark-700 transition border border-dark-border md:border-transparent">
                    <i class="ph ph-trash"></i> 清空本地数据
                </button>
            </div>
        </aside>

        <!-- 右侧：沉浸式编辑器 -->
        <section class="flex-1 flex flex-col bg-[#0f1423] relative z-10 w-full overflow-hidden">
            
            <div class="h-10 flex items-center justify-between px-4 md:px-8 text-[10px] md:text-xs text-gray-500 border-b border-white/[0.02] bg-dark-900/30">
                <span class="hidden sm:inline">输入前缀内容，AI 将顺着你的思路续写</span>
                <span class="sm:hidden">开始你的创作…</span>
                <div class="flex items-center gap-3 md:gap-4">
					<span id="status-indicator" class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-green-500/80"></span>就绪</span>
					<!-- Token 消耗与缓存统计 (默认隐藏) -->
					<span id="token-info" class="hidden font-mono bg-dark-800 px-2 py-0.5 rounded text-gray-400">
						Tokens: <span id="total-tokens" class="text-primary-400">0</span> 
						(缓存: <span id="cached-tokens" class="text-green-400">0</span>)
					</span>
					<span class="font-mono bg-dark-800 px-2 py-0.5 rounded"><span id="word-count">0</span> 字</span>
				</div>
            </div>

            <!-- 核心输入区 -->
            <div id="editor-wrapper" class="flex-1 p-4 md:p-8 overflow-y-auto flex flex-col transition-all duration-300 custom-scrollbar relative">
                <!-- 注意去掉了h-full改为min-h-full，防止手机端内容长了之后光标定位异常 -->
                <textarea id="assistant_prefix" class="flex-1 w-full min-h-full bg-transparent text-gray-200 text-base md:text-lg leading-relaxed placeholder-gray-600 resize-none outline-none" placeholder="写下第一句，例如：夜雨中，他缓缓拔出了那把生锈的剑..."></textarea>
            </div>

            <!-- 底部悬浮控制台 (完美适配手机) -->
            <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 glass-panel w-[92%] md:w-auto px-4 py-3 md:px-6 md:py-4 rounded-xl md:rounded-2xl shadow-2xl flex items-center justify-between gap-3 md:gap-6 z-20">
                
                <div class="flex flex-col flex-1">
                    <span class="hidden md:block text-[10px] text-gray-400 mb-1 ml-1 font-mono tracking-widest uppercase">Action (Ctrl+Enter)</span>
                    <div class="flex gap-2 w-full">
                        <button id="gen-btn" onclick="startGeneration()" class="flex-1 md:flex-none justify-center bg-primary-600 hover:bg-primary-500 text-white px-4 md:px-8 py-2 md:py-2.5 rounded-lg md:rounded-xl text-sm md:text-base font-medium shadow-[0_0_15px_rgba(99,102,241,0.4)] transition-all active:scale-95 flex items-center gap-2">
                            <i class="ph-bold ph-magic-wand"></i> <span class="whitespace-nowrap">智能续写</span>
                        </button>
                        <button id="stop-btn" onclick="stopGeneration()" class="hidden flex-1 md:flex-none justify-center bg-gray-700 hover:bg-red-500/80 text-white px-4 md:px-5 py-2 md:py-2.5 rounded-lg md:rounded-xl text-sm md:text-base font-medium transition-all flex items-center gap-2">
                            <i class="ph-bold ph-stop"></i> <span class="whitespace-nowrap">中断</span>
                        </button>
                    </div>
                </div>

                <div class="w-px h-8 md:h-10 bg-gray-700 shrink-0"></div>

                <div class="flex gap-1.5 md:gap-2 shrink-0">
                    <button onclick="copyContent()" class="w-10 h-10 md:w-11 md:h-11 rounded-lg md:rounded-xl bg-dark-700 hover:bg-dark-600 text-gray-300 flex items-center justify-center transition" title="复制全部内容">
                        <i class="ph ph-copy text-lg md:text-xl"></i>
                    </button>
                    <button id="undo-btn" onclick="undoLast()" class="w-10 h-10 md:w-11 md:h-11 rounded-lg md:rounded-xl bg-dark-700 text-gray-300 flex items-center justify-center transition" title="撤销 (Undo)">
						<i class="ph ph-arrow-u-up-left text-lg md:text-xl"></i>
					</button>
					<button id="redo-btn" onclick="redoLast()" class="w-10 h-10 md:w-11 md:h-11 rounded-lg md:rounded-xl bg-dark-700 text-gray-300 flex items-center justify-center transition" title="重做 (Redo)">
						<i class="ph ph-arrow-u-up-right text-lg md:text-xl"></i>
					</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Toast 弹窗 (居中适配手机) -->
    <div id="toast-container" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 w-[90%] sm:w-auto pointer-events-none"></div>

    <script>
        const elements = {
            apiKey: document.getElementById('api_key'),
            modelSelect: document.getElementById('model_select'),
            userPrompt: document.getElementById('user_prompt'),
            temp: document.getElementById('temp'),
            tempVal: document.getElementById('temp-val'),
            maxTokens: document.getElementById('max_tokens'),
            tokensVal: document.getElementById('tokens-val'),
            editor: document.getElementById('assistant_prefix'),
            wordCount: document.getElementById('word-count')
        };

        let controller;
		
		// --- 撤销/重做历史记录系统 ---
		let textHistory = [];
		let historyIndex = -1;

		// 保存当前文本状态到历史记录栈
		function saveHistoryState(content) {
			// 如果当前处于“撤销”状态后又发生了新操作，则丢弃当前位置之后的重做记录
			if (historyIndex < textHistory.length - 1) {
				textHistory = textHistory.slice(0, historyIndex + 1);
			}
			// 避免连续存入相同的内容
			if (textHistory.length === 0 || textHistory[historyIndex] !== content) {
				textHistory.push(content);
				historyIndex++;
				
				// 限制历史记录最多 50 步，防止内存占用过大
				if (textHistory.length > 50) {
					textHistory.shift();
					historyIndex--;
				}
			}
			updateHistoryButtonsUI();
		}

        // --- 手机端抽屉菜单逻辑 ---
        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            if (sidebar.classList.contains('-translate-x-full')) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        // --- 桌面端专注模式逻辑 ---
        let isFocusMode = false;
        function toggleFocusMode() {
            const sidebar = document.getElementById('sidebar');
            isFocusMode = !isFocusMode;
            if(isFocusMode) {
                sidebar.classList.add('md:-ml-80'); 
                showToast("已开启专注模式，侧边栏已隐藏", "info");
            } else {
                sidebar.classList.remove('md:-ml-80');
            }
        }

        // --- 自动保存系统 (Local Storage) ---
        const storageKeys = ['api_key', 'model_select', 'user_prompt', 'temp', 'max_tokens', 'assistant_prefix'];

        function saveToLocal() {
            storageKeys.forEach(key => {
                localStorage.setItem(`ds_${key}`, document.getElementById(key).value);
            });
            updateSlidersUI();
        }

        function loadFromLocal() {
            storageKeys.forEach(key => {
                const saved = localStorage.getItem(`ds_${key}`);
                if (saved !== null) {
                    document.getElementById(key).value = saved;
                }
            });
            updateSlidersUI();
            updateWordCount();
        }

        storageKeys.forEach(key => {
            document.getElementById(key).addEventListener('input', saveToLocal);
            document.getElementById(key).addEventListener('change', saveToLocal);
        });

        window.addEventListener('DOMContentLoaded', () => {
			loadFromLocal();
			saveHistoryState(elements.editor.value); // 初始化时把已有内容作为第 0 步
		});

        // --- UI 逻辑 ---
        function updateSlidersUI() {
            elements.tempVal.innerText = elements.temp.value;
            const tokenVal = parseInt(elements.maxTokens.value);
            elements.tokensVal.innerText = tokenVal >= 8192 ? "无限制" : tokenVal;
        }

        function updateWordCount() {
            elements.wordCount.innerText = elements.editor.value.length;
        }
        elements.editor.addEventListener('input', updateWordCount);

        function toggleKeyVisibility() {
            const icon = document.getElementById('key-icon');
            if (elements.apiKey.type === 'password') {
                elements.apiKey.type = 'text';
                icon.className = 'ph ph-eye-slash text-lg text-primary-400';
            } else {
                elements.apiKey.type = 'password';
                icon.className = 'ph ph-eye text-lg';
            }
        }

		document.addEventListener('keydown', (e) => {
			if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
				e.preventDefault();
				const stopBtn = document.getElementById('stop-btn');
				!stopBtn.classList.contains('hidden') ? stopGeneration() : startGeneration();
			}
		});

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'success' ? '<i class="ph-fill ph-check-circle text-green-400 text-lg"></i>' : 
                         type === 'error' ? '<i class="ph-fill ph-warning-circle text-red-400 text-lg"></i>' : 
                         '<i class="ph-fill ph-info text-blue-400 text-lg"></i>';
            
            toast.className = `glass-panel text-white px-4 py-3 rounded-xl shadow-2xl flex items-center justify-center sm:justify-start gap-3 text-sm font-medium toast-enter w-full sm:w-auto`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-enter-active');
            });

            setTimeout(() => {
                toast.classList.remove('toast-enter-active');
                toast.classList.add('toast-leave');
                setTimeout(() => toast.remove(), 200);
            }, 3000);
        }

        // --- 核心网络请求逻辑 ---
        async function startGeneration() {
			if (!document.getElementById('stop-btn').classList.contains('hidden')) return;
            const apiKey = elements.apiKey.value.trim();
            const prefix = elements.editor.value;

            if (!apiKey) {
                // 如果侧边栏隐藏了，手机端自动打开让用户填
                if(window.innerWidth < 768) toggleMobileMenu();
                showToast("请先在设置中输入 API Key！", "error");
                elements.apiKey.focus();
                return;
            }
            if (!prefix.trim()) {
                showToast("请在输入区写下开场白！", "error");
                elements.editor.focus();
                return;
            }

            saveHistoryState(prefix);
            
            const requestBody = {
                model: elements.modelSelect.value,
                messages: [
                    { role: "system", content: elements.userPrompt.value },
                    { role: "assistant", content: prefix, prefix: true }
                ],
                stream: true,
                temperature: parseFloat(elements.temp.value)
            };

            const tokenLimit = parseInt(elements.maxTokens.value);
            if (tokenLimit < 8192) {
                requestBody.max_tokens = tokenLimit;
            }

            const btn = document.getElementById('gen-btn');
            const stopBtn = document.getElementById('stop-btn');
            const statusIndicator = document.getElementById('status-indicator');
            const wrapper = document.getElementById('editor-wrapper');

            btn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            statusIndicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-primary-500 animate-ping"></span>思考中...';
			document.getElementById('token-info').classList.add('hidden');
            
            // 避免在手机端添加光晕导致轻微卡顿
            if(window.innerWidth >= 768) wrapper.classList.add('animate-pulse-glow');
            
            controller = new AbortController();

            try {
                const response = await fetch('https://api.deepseek.com/beta/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify(requestBody),
                    signal: controller.signal
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || `HTTP 错误 ${response.status}`);
                }

                statusIndicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-primary-500 animate-ping"></span>输出中...';

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";
                
                // 定时滚动逻辑(防止高频操作引发手机端重绘卡顿)
                let scrollTimeout;

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); 

                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
								const data = JSON.parse(line.slice(6));
								
								// 1. 安全地提取正文内容
								if (data.choices && data.choices.length > 0) {
									const content = data.choices[0].delta?.content;
									if (content) {
										elements.editor.value += content;
										updateWordCount();
										
										if (!scrollTimeout) {
											scrollTimeout = setTimeout(() => {
												if (wrapper.scrollHeight - wrapper.scrollTop <= wrapper.clientHeight + 200) {
													wrapper.scrollTop = wrapper.scrollHeight;
												}
												scrollTimeout = null;
											}, 50);
										}
									}
								}
								
								// 2. 提取并显示 usage 统计
								if (data.usage) {
									const totalTokens = data.usage.total_tokens || 0;
									// 兼容 DeepSeek 格式和 OpenAI 标准格式的缓存字段
									const cachedTokens = data.usage.prompt_cache_hit_tokens || 
														(data.usage.prompt_tokens_details && data.usage.prompt_tokens_details.cached_tokens) || 0;
									
									// 显示出来
									document.getElementById('token-info').classList.remove('hidden');
									document.getElementById('total-tokens').innerText = totalTokens;
									document.getElementById('cached-tokens').innerText = cachedTokens;
								}
							} catch (e) {
								console.error("解析出错:", line, e);
							}
                        }
                    }
                }
                
                showToast("续写完成！");
                saveToLocal(); 
                
            } catch (err) {
                if (err.name === 'AbortError') {
                    showToast("已中断续写", "info");
                } else {
                    showToast("请求失败: " + err.message, "error");
                }
            } finally {
                btn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
                statusIndicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500/80"></span>就绪';
                wrapper.classList.remove('animate-pulse-glow');
				saveHistoryState(elements.editor.value);
            }
        }

        function stopGeneration() {
            if (controller) controller.abort();
        }

        function copyContent() {
            navigator.clipboard.writeText(elements.editor.value).then(() => {
                showToast("全文已复制！");
            });
        }

		// 更新撤销/还原按钮的可点击状态和视觉样式
		function updateHistoryButtonsUI() {
			function setButtonState(btn, enabled) {
				if (enabled) {
					btn.classList.remove('opacity-20', 'pointer-events-none', 'grayscale');
					btn.classList.add('hover:bg-dark-600', 'cursor-pointer');
				} else {
					btn.classList.add('opacity-20', 'pointer-events-none', 'grayscale');
					btn.classList.remove('hover:bg-dark-600', 'cursor-pointer');
				}
			}
			setButtonState(document.getElementById('undo-btn'), historyIndex > 0);
			setButtonState(document.getElementById('redo-btn'), historyIndex < textHistory.length - 1);
		}

        function undoLast() {
			const currentText = elements.editor.value;
			// 如果用户在最后一次生成后手动打字了，先保存手动输入的状态，以便可以重做回来
			if (historyIndex >= 0 && currentText !== textHistory[historyIndex]) {
				saveHistoryState(currentText);
			}

			if (historyIndex > 0) {
				historyIndex--;
				elements.editor.value = textHistory[historyIndex];
				updateWordCount();
				saveToLocal();
				updateHistoryButtonsUI();
			}
		}

		function redoLast() {
			if (historyIndex < textHistory.length - 1) {
				historyIndex++;
				elements.editor.value = textHistory[historyIndex];
				updateWordCount();
				saveToLocal();
				updateHistoryButtonsUI();
			}
		}

		function clearAll() {
			if(confirm("确定要清空除 API Key 以外的所有内容吗？")) {
				storageKeys.forEach(key => {
					if(key !== 'api_key' && key !== 'model_select' && key !== 'temp' && key !== 'max_tokens') {
						document.getElementById(key).value = "";
						localStorage.removeItem(`ds_${key}`);
					}
				});
				updateWordCount();
				
				// 重置历史记录栈
				textHistory = [];
				historyIndex = -1;
				saveHistoryState(""); 
				
				showToast("工作区已清空");
				if(window.innerWidth < 768) toggleMobileMenu();
				updateHistoryButtonsUI();
			}
		}

        function exportDoc() {
            if(!elements.editor.value) {
                showToast("没有可导出的内容", "error");
                return;
            }
            const blob = new Blob([elements.editor.value], { type: 'text/plain;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `DeepSeek_${new Date().getTime()}.txt`;
            a.click();
            showToast("文件已下载");
        }
    </script>
</body>
</html>
