<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Pro Writer | 纯粹写作</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: { 900: '#0B0F19', 800: '#111827', 700: '#1F2937', border: '#ffffff1a' },
                        primary: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5' }
                    },
                    animation: { 'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite' },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 0 0 rgba(99, 102, 241, 0)' },
                            '50%': { boxShadow: '0 0 20px 2px rgba(99, 102, 241, 0.3)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4B5563; }
        
        .glass-panel { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        /* Toast 动画 */
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .toast-leave { opacity: 0; transition: all 0.2s ease-in; }

        /* 解决遮挡问题的核心：给文本框底部留出120px的空间 */
        #assistant_prefix { padding-bottom: 120px; }
    </style>
</head>
<body class="bg-dark-900 text-gray-300 font-sans h-screen flex flex-col overflow-hidden selection:bg-primary-500/30 selection:text-white">

    <!-- 顶部导航栏 -->
    <header class="h-14 border-b border-dark-border flex items-center justify-between px-6 bg-dark-900/80 backdrop-blur-md z-20 shrink-0">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center text-white shadow-lg shadow-primary-500/20">
                <i class="ph-bold ph-pen-nib text-xl"></i>
            </div>
            <h1 class="font-semibold text-gray-100 tracking-wide">DeepSeek Studio <span class="text-xs font-normal text-primary-400 bg-primary-500/10 px-2 py-0.5 rounded ml-2">Web Pro</span></h1>
        </div>
        <div class="flex items-center gap-4 text-sm">
            <button onclick="toggleFocusMode()" class="flex items-center gap-2 text-gray-400 hover:text-white transition" title="专注模式">
                <i class="ph ph-corners-out text-lg"></i>
            </button>
            <button onclick="exportDoc()" class="flex items-center gap-2 text-gray-400 hover:text-white transition">
                <i class="ph ph-export text-lg"></i> 导出TXT
            </button>
        </div>
    </header>

    <!-- 主体工作区 -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- 左侧：参数与设定 -->
        <aside id="sidebar" class="w-80 border-r border-dark-border bg-dark-800/30 flex flex-col transition-all duration-300 shrink-0 z-10">
            <div class="p-5 flex-1 overflow-y-auto space-y-6">
                
                <!-- 模块：全局设置 (API Key & Model) -->
                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 block">1. 核心鉴权 (API Key)</label>
                        <div class="relative">
                            <input type="password" id="api_key" class="w-full bg-dark-900 border border-dark-border rounded-lg p-2.5 pr-10 text-sm text-gray-200 focus:outline-none focus:border-primary-500 transition" placeholder="sk-...">
                            <button onclick="toggleKeyVisibility()" class="absolute right-3 top-2.5 text-gray-500 hover:text-gray-300">
                                <i id="key-icon" class="ph ph-eye text-lg"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 block">2. 模型选择 (Model)</label>
                        <select id="model_select" class="w-full bg-dark-900 border border-dark-border rounded-lg p-2.5 text-sm text-gray-200 focus:outline-none focus:border-primary-500 transition appearance-none cursor-pointer">
                            <option value="deepseek-v4-pro">deepseek-v4-pro (最强推理)</option>
                            <option value="deepseek-v4-flash">deepseek-v4-flash (极速响应)</option>
                        </select>
                    </div>
                </div>

                <div class="h-px bg-dark-border w-full"></div>

                <!-- 模块：世界观设定 -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">3. 故事设定 (System/User)</label>
                    </div>
                    <textarea id="user_prompt" rows="5" class="w-full bg-dark-900 border border-dark-border rounded-xl p-3 text-sm text-gray-200 placeholder-gray-600 focus:outline-none focus:border-primary-500 transition resize-none" placeholder="在这里输入大纲或背景设定..."></textarea>
                </div>

                <!-- 模块：引擎参数 -->
                <div>
                    <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4 block">4. 引擎参数 (Parameters)</label>
                    
                    <!-- 温度调节 -->
                    <div class="space-y-3 mb-5">
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-gray-300">创作温度 <span class="text-gray-500 text-xs ml-1">(Temp)</span></span>
                            <span id="temp-val" class="font-mono text-primary-400 bg-primary-500/10 px-2 py-0.5 rounded">1.0</span>
                        </div>
                        <input type="range" id="temp" min="0" max="2.0" step="0.1" value="1.0" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-primary-500">
                    </div>

                    <!-- 长度限制 -->
                    <div class="space-y-3">
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-gray-300">最大生成长度 <span class="text-gray-500 text-xs ml-1">(Tokens)</span></span>
                            <span id="tokens-val" class="font-mono text-primary-400 bg-primary-500/10 px-2 py-0.5 rounded">无限制</span>
                        </div>
                        <!-- 滑块 max=8192，当处于8192时视为无限制 -->
                        <input type="range" id="max_tokens" min="256" max="8192" step="256" value="8192" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-primary-500">
                    </div>
                </div>
            </div>
            
            <div class="p-5 border-t border-dark-border bg-dark-800">
                <button onclick="clearAll()" class="w-full flex items-center justify-center gap-2 py-2 rounded-lg text-sm text-gray-400 hover:text-red-400 hover:bg-dark-700 transition">
                    <i class="ph ph-trash"></i> 清空本地数据
                </button>
            </div>
        </aside>

        <!-- 右侧：沉浸式编辑器 -->
        <section class="flex-1 flex flex-col bg-[#0f1423] relative">
            
            <div class="h-10 flex items-center justify-between px-8 text-xs text-gray-500 border-b border-white/[0.02]">
                <span>输入前缀内容，AI 将顺着你的思路续写</span>
                <div class="flex items-center gap-4">
                    <span id="status-indicator" class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-green-500/80"></span>就绪</span>
                    <span class="font-mono bg-dark-800 px-2 py-0.5 rounded"><span id="word-count">0</span> 字</span>
                </div>
            </div>

            <!-- 核心输入区 -->
            <div id="editor-wrapper" class="flex-1 p-8 overflow-hidden flex flex-col transition-all duration-300">
                <textarea id="assistant_prefix" class="flex-1 w-full h-full bg-transparent text-gray-200 text-lg leading-relaxed placeholder-gray-700 resize-none outline-none custom-scrollbar" placeholder="写下第一句，例如：夜雨中，他缓缓拔出了那把生锈的剑..."></textarea>
            </div>

            <!-- 底部悬浮控制台 -->
            <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 glass-panel px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-6 z-30">
                
                <div class="flex flex-col">
                    <span class="text-[10px] text-gray-400 mb-1 ml-1 font-mono tracking-widest uppercase">Action (Ctrl+Enter)</span>
                    <div class="flex gap-2">
                        <button id="gen-btn" onclick="startGeneration()" class="bg-primary-600 hover:bg-primary-500 text-white px-8 py-2.5 rounded-xl font-medium shadow-[0_0_15px_rgba(99,102,241,0.4)] transition-all active:scale-95 flex items-center gap-2">
                            <i class="ph-bold ph-magic-wand"></i> 智能续写
                        </button>
                        <button id="stop-btn" onclick="stopGeneration()" class="hidden bg-gray-700 hover:bg-red-500/80 text-white px-5 py-2.5 rounded-xl font-medium transition-all flex items-center gap-2">
                            <i class="ph-bold ph-stop"></i> 中断
                        </button>
                    </div>
                </div>

                <div class="w-px h-10 bg-gray-700"></div>

                <div class="flex gap-2">
                    <button onclick="copyContent()" class="w-10 h-10 rounded-xl bg-dark-700 hover:bg-dark-600 text-gray-300 flex items-center justify-center transition" title="复制全部内容">
                        <i class="ph ph-copy text-lg"></i>
                    </button>
                    <button onclick="undoLast()" class="w-10 h-10 rounded-xl bg-dark-700 hover:bg-dark-600 text-gray-300 flex items-center justify-center transition" title="撤销到 AI 生成前">
                        <i class="ph ph-arrow-u-up-left text-lg"></i>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <div id="toast-container" class="fixed top-6 right-6 z-50 flex flex-col gap-2"></div>

    <script>
        // DOM 元素绑定
        const elements = {
            apiKey: document.getElementById('api_key'),
            modelSelect: document.getElementById('model_select'),
            userPrompt: document.getElementById('user_prompt'),
            temp: document.getElementById('temp'),
            tempVal: document.getElementById('temp-val'),
            maxTokens: document.getElementById('max_tokens'),
            tokensVal: document.getElementById('tokens-val'),
            editor: document.getElementById('assistant_prefix'),
            wordCount: document.getElementById('word-count')
        };

        let controller;
        let originalContent = ''; 

        // 🌟 1. 自动保存与恢复系统 (Local Storage)
        const storageKeys = ['api_key', 'model_select', 'user_prompt', 'temp', 'max_tokens', 'assistant_prefix'];

        function saveToLocal() {
            storageKeys.forEach(key => {
                localStorage.setItem(`ds_${key}`, document.getElementById(key).value);
            });
            updateSlidersUI();
        }

        function loadFromLocal() {
            storageKeys.forEach(key => {
                const saved = localStorage.getItem(`ds_${key}`);
                if (saved !== null) {
                    document.getElementById(key).value = saved;
                }
            });
            updateSlidersUI();
            updateWordCount();
        }

        // 监听所有输入事件以自动保存
        storageKeys.forEach(key => {
            document.getElementById(key).addEventListener('input', saveToLocal);
            document.getElementById(key).addEventListener('change', saveToLocal);
        });

        // 页面加载时恢复数据
        window.addEventListener('DOMContentLoaded', loadFromLocal);

        // 🌟 2. UI 交互逻辑
        function updateSlidersUI() {
            elements.tempVal.innerText = elements.temp.value;
            const tokenVal = parseInt(elements.maxTokens.value);
            elements.tokensVal.innerText = tokenVal >= 8192 ? "无限制" : tokenVal;
        }

        function updateWordCount() {
            elements.wordCount.innerText = elements.editor.value.length;
        }
        elements.editor.addEventListener('input', updateWordCount);

        function toggleKeyVisibility() {
            const icon = document.getElementById('key-icon');
            if (elements.apiKey.type === 'password') {
                elements.apiKey.type = 'text';
                icon.className = 'ph ph-eye-slash text-lg text-primary-400';
            } else {
                elements.apiKey.type = 'password';
                icon.className = 'ph ph-eye text-lg';
            }
        }

        // 快捷键触发
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                startGeneration();
            }
        });

        // 专业级 Toast 通知
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const icon = type === 'success' ? '<i class="ph-fill ph-check-circle text-green-400 text-lg"></i>' : 
                         type === 'error' ? '<i class="ph-fill ph-warning-circle text-red-400 text-lg"></i>' : 
                         '<i class="ph-fill ph-info text-blue-400 text-lg"></i>';
            
            toast.className = `glass-panel text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium toast-enter min-w-[250px]`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-enter-active');
            });

            setTimeout(() => {
                toast.classList.remove('toast-enter-active');
                toast.classList.add('toast-leave');
                setTimeout(() => toast.remove(), 200);
            }, 3000);
        }

        // 🌟 3. 核心：纯前端直连 DeepSeek API 流式输出
        async function startGeneration() {
            const apiKey = elements.apiKey.value.trim();
            const prefix = elements.editor.value;

            if (!apiKey) {
                showToast("请先在左侧输入 API Key！", "error");
                elements.apiKey.focus();
                return;
            }
            if (!prefix.trim()) {
                showToast("请在右侧写下开场白！", "error");
                elements.editor.focus();
                return;
            }

            originalContent = prefix; // 用于撤销
            
            // 构建请求参数
            const requestBody = {
                model: elements.modelSelect.value,
                messages: [
                    { role: "user", content: elements.userPrompt.value },
                    { role: "assistant", content: prefix, prefix: true }
                ],
                stream: true,
                temperature: parseFloat(elements.temp.value)
            };

            // 处理无限制滑块 (当滑块没有拉到满值时，才附加 max_tokens)
            const tokenLimit = parseInt(elements.maxTokens.value);
            if (tokenLimit < 8192) {
                requestBody.max_tokens = tokenLimit;
            }

            // 切换 UI 状态
            const btn = document.getElementById('gen-btn');
            const stopBtn = document.getElementById('stop-btn');
            const statusIndicator = document.getElementById('status-indicator');
            const wrapper = document.getElementById('editor-wrapper');

            btn.classList.add('hidden');
            stopBtn.classList.remove('hidden');
            statusIndicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-primary-500 animate-ping"></span>正在思考...';
            wrapper.classList.add('animate-pulse-glow');
            
            controller = new AbortController();

            try {
                // 使用 Fetch 原生直连 DeepSeek API
                const response = await fetch('https://api.deepseek.com/beta/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify(requestBody),
                    signal: controller.signal
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || `HTTP 错误 ${response.status}`);
                }

                statusIndicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-primary-500 animate-ping"></span>正在输出...';

                // 解析 Server-Sent Events (SSE) 数据流
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // 保留最后一行未完整的数据

                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(line.slice(6));
                                const content = data.choices[0].delta.content;
                                if (content) {
                                    elements.editor.value += content;
                                    updateWordCount();
                                    
                                    // 自动滚动 (仅当距离底部小于 150px 时触发，不打断用户回看)
                                    if (elements.editor.scrollHeight - elements.editor.scrollTop <= elements.editor.clientHeight + 150) {
                                        elements.editor.scrollTop = elements.editor.scrollHeight;
                                    }
                                }
                            } catch (e) {
                                console.error("解析流式数据块出错:", e, line);
                            }
                        }
                    }
                }
                
                showToast("续写完成！");
                saveToLocal(); // 续写完成后触发保存
                
            } catch (err) {
                if (err.name === 'AbortError') {
                    showToast("已中断续写", "info");
                } else {
                    showToast("请求失败: " + err.message, "error");
                }
            } finally {
                // 恢复 UI 状态
                btn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
                statusIndicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-green-500/80"></span>就绪';
                wrapper.classList.remove('animate-pulse-glow');
            }
        }

        function stopGeneration() {
            if (controller) controller.abort();
        }

        // 🌟 4. 辅助工具功能
        function copyContent() {
            navigator.clipboard.writeText(elements.editor.value).then(() => {
                showToast("全文已复制！");
            });
        }

        function undoLast() {
            if(originalContent && elements.editor.value !== originalContent) {
                elements.editor.value = originalContent;
                updateWordCount();
                saveToLocal();
                showToast("已撤销刚刚的续写", "info");
            } else {
                showToast("没有可以撤销的内容", "info");
            }
        }

        function clearAll() {
            if(confirm("确定要清空除 API Key 以外的所有内容吗？")) {
                storageKeys.forEach(key => {
                    if(key !== 'api_key' && key !== 'model_select' && key !== 'temp' && key !== 'max_tokens') {
                        document.getElementById(key).value = "";
                        localStorage.removeItem(`ds_${key}`);
                    }
                });
                updateWordCount();
                originalContent = "";
                showToast("工作区已清空");
            }
        }

        function exportDoc() {
            if(!elements.editor.value) {
                showToast("没有可导出的内容", "error");
                return;
            }
            const blob = new Blob([elements.editor.value], { type: 'text/plain;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `DeepSeek_续写_${new Date().getTime()}.txt`;
            a.click();
            showToast("文件已下载");
        }

        let isFocusMode = false;
        function toggleFocusMode() {
            const sidebar = document.getElementById('sidebar');
            isFocusMode = !isFocusMode;
            if(isFocusMode) {
                sidebar.classList.add('-ml-80'); 
                showToast("已开启专注写作模式", "info");
            } else {
                sidebar.classList.remove('-ml-80');
            }
        }
    </script>
</body>
</html>
